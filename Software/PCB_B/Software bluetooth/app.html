<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROBOT CHAT</title>
  <style>
    body {
      background-image: url(tomjerry.jpg); 
      background-size: cover;       /* scale to fill screen */
      background-position: center;  /* center it */
      background-repeat: no-repeat; /* no repeating */
      margin: 0;                    /* remove default margins */
      padding: 0;
      height: 100vh;                /* full viewport height */
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;        /* makes margin auto work */
      margin: 20px auto; 
      border: 2px solid black;
      background-color: #3a3a3a;
    }

    #ble-info {
      position: fixed;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      border-left: 2px solid #444;
    }
    #ble-info h3 {
      margin-top: 0;
      text-align: center;
    }

    #notify-info {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      border-right: 2px solid #444;
    }
    #notify-info h3 {
      margin-top: 0;
      text-align: center;
    }


  </style>


  <script>
    // Run this as soon as the page loads
    window.addEventListener('load', () => {
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      if (!isChrome) {
        alert("⚠️ This page only works with Chrome!");
      }
    });
  </script>

</head>
<body>
  <h2 style="text-align:center;color:rgb(45, 45, 45);">ROBOT CHAT</h2>

  <div style="text-align: center; margin-bottom: 20px;">
    <label style="color: white;">Width: <input id="arenaWidth" type="number" value="400"></label>
    <label style="color: white;">Height: <input id="arenaHeight" type="number" value="300"></label>
    <br><br>
    <button id="resize">Resize Arena</button>
    <button id="connect">Connect to Robot (BLE)</button>
  </div>

  <div style="text-align: center; margin-bottom: 20px;">
  <label style="color: white;">
    Service UUID: <input type="text" id="serviceUUID" size="50" value="00000000-cc7a-482a-984a-7f2ed5b3e58f">
  </label>
  <br><br>
  <label style="color: white;">
    Position Characteristic: <input type="text" id="charPosition" size="50" value="000000a3-0000-1000-8000-00805f9b34fb">
  </label>
  <!-- <br>
  <label style="color: white;">
    Angle Characteristic: <input type="text" id="charAngle" value=00000000-cc7a-482a-984a-7f2ed5b3e58f>
  </label>
  <br>
  <label style="color: white;">
    Target Characteristic: <input type="text" id="charTarget" value=00000000-cc7a-482a-984a-7f2ed5b3e58f>
  </label>
  <br><br> -->
  </div>

  <div id="ble-info">
  <h3>Services & Caractéristiques</h3>
  <pre id="ble-log"></pre>
  </div>

  <div id="notify-info">
  <h3>Notifications reçues</h3>
  <pre id="notify-log"></pre>
  </div>




  <br><br>
  <canvas id="arena" width="400" height="300"></canvas>

  <script>
    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");
    let robot = { x: 50, y: 50, angle: 30};
    let target = { x: 100, y: 50, angle: 30};

    function drawArena() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw perimeter rectangle
      ctx.strokeStyle = "black";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      // Draw 
      ctx.save();
      ctx.translate(robot.x, robot.y);       // move to robot position
      ctx.rotate(robot.angle);               // rotate
      ctx.font = "32px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐱", 0, 0);              // draw at (0,0)
      ctx.restore();
      ctx.save();
      ctx.translate(target.x, target.y);       // move to robot position              
      ctx.font = "32px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐭", 0, 0);
      ctx.restore();
    }

    function moveRobot(x, y, angle) {
      robot.x = x;
      robot.y = y;
      robot.angle = angle;
      drawArena();
    }

      function moveTarget(x, y) {
      target.x = x;
      target.y = y;
      drawArena();
    }

    function logBLE(message) {
    const log = document.getElementById("ble-log");
    log.textContent += message + "\n";
    }

    function logNotify(message) {
      const log = document.getElementById("notify-log");
      let lines = log.textContent.trim().split("\n");

    // Ajouter le nouveau message en haut
      lines.unshift(message);

    // Garder seulement 20 lignes max
      if (lines.length > 20) {
        lines = lines.slice(0, 20);
      }

      log.textContent = lines.join("\n");
    }


    // Handle arena resize
    document.getElementById("resize").addEventListener("click", () => {
      const w = parseInt(document.getElementById("arenaWidth").value);
      const h = parseInt(document.getElementById("arenaHeight").value);
      canvas.width = w;
      canvas.height = h;
      drawArena();
    });

    

    // === BLE Connection ===
    document.getElementById("connect").addEventListener("click", async () => {
  try {
    // Get UUIDs from input boxes
    const serviceUUID = document.getElementById("serviceUUID").value.trim();
    const charPositionUUID = document.getElementById("charPosition").value.trim();

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [serviceUUID]
    });

    logBLE("Appareil sélectionné : " + device.name);

    const server = await device.gatt.connect(); 

    const services = await server.getPrimaryServices();

    for (const service of services) {
      logBLE("Service: " + service.uuid);

      const characteristics = await service.getCharacteristics();
      for (const char of characteristics) {
        logBLE("   ↳ Caractéristique: " + char.uuid + " props: " + JSON.stringify(char.properties));
      }
    }
    
    const service = await server.getPrimaryService(serviceUUID);
    const characteristic = await service.getCharacteristic(charPositionUUID);

    logBLE("characteristic :" + characteristic)
    // Start notifications for position
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', event => {
      const data = event.target.value;
      let x = data.getUint8(0);
      let y = data.getUint8(1);
      let angle = data.getUint8(2);
      let x_t = data.getUint8(3);
      let y_t = data.getUint8(4);
      moveTarget(x_t, y_t);
      moveRobot(x, y, robot.angle);
      logNotify(`X=${x} Y=${y} Angle=${angle} Target=(${x_t},${y_t})`);
    });

    // // Start notifications for angle
    // await characteristic.startNotifications();
    // characteristic.addEventListener('characteristicvaluechanged', event => {
    //   const data = event.target.value;
    //   let angle = data.getUint8(0);
    //   moveRobot(robot.x, robot.y, angle);
    // });

    // // Start notifications for target
    // await characteristicTarget.startNotifications();
    // characteristicTarget.addEventListener('characteristicvaluechanged', event => {
    //   const data = event.target.value;
    //   let x_t = data.getUint8(0);
    //   let y_t = data.getUint8(1);
    //   moveTarget(x_t, y_t);
    // });

  } catch (err) {
    console.error("Erreur BLE :", err);
    logBLE("Erreur : " + err);
  }
});


    // Initial draw
    drawArena();
  </script>
</body>
</html>
