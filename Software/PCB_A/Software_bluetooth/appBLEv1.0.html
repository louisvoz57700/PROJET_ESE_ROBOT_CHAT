<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROBOT CHAT</title>
  <style>
    body {
      background-image: url(tomjerry.jpg); 
      background-size: cover;       /* scale to fill screen */
      background-position: center;  /* center it */
      background-repeat: no-repeat; /* no repeating */
      margin: 0;                    /* remove default margins */
      padding: 0;
      height: 100vh;                /* full viewport height */
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;        /* makes margin auto work */
      margin: 20px auto; 
      border: 2px solid black;
      background-color: #3a3a3a;
    }

    #ble-info {
      position: fixed;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      border-left: 2px solid #444;
    }
    #ble-info h3 {
      margin-top: 0;
      text-align: center;
    }

    #notify-info {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      border-right: 2px solid #444;
    }
    #notify-info h3 {
      margin-top: 0;
      text-align: center;
    }


  </style>

<style>
  .ble-button {
    font-size: 1.2em;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    padding: 10px 25px;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.1s, box-shadow 0.3s;
    min-width: 160px;
  }

  .ble-button:hover {
    transform: scale(1.05);
  }

  .on {
    background-color: #28a745; /* vert */
    box-shadow: 0 0 10px #28a745;
  }

  .off {
    background-color: #dc3545; /* rouge */
    box-shadow: 0 0 10px #dc3545;
  }

  .cat {
    background-color: #ff9800; /* orange */
    box-shadow: 0 0 10px #ff9800;
  }

  .mouse {
    background-color: #03a9f4; /* bleu clair */
    box-shadow: 0 0 10px #03a9f4;
  }

  .connect {
    background-color: #6c757d; /* gris avant connexion */
  }

  .connected {
    background-color: #28a745; /* vert après connexion */
    box-shadow: 0 0 10px #28a745;
  }
</style>


  <script>
    // Run this as soon as the page loads
    window.addEventListener('load', () => {
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      if (!isChrome) {
        alert("⚠️ This page only works with Chrome!");
      }
    });
  </script>

</head>
<body>
  <h2 style="text-align:center;color:rgb(45, 45, 45);">ROBOT CHAT</h2>

  <div style="text-align: center; margin-bottom: 20px;">
    <button id="connect" class="ble-button connect">Connect to Robot (BLE)</button>
  </div>

  <div style="text-align: center; margin-bottom: 20px; color: white;">
    <!-- Sélection du service -->
    <label>
      Service UUID :
      <select id="serviceUUID">
        <option value="00000000-cc7a-482a-984a-7f2ed5b3e58f">mySTM32WB15CC (not yours)</option>
        <option value="00000001-cc7a-482a-984a-7f2ed5b3e58f">mySTM32WB55 (not yours)</option>
        <option value="custom">Other (custom)</option>
      </select>
      <input type="text" id="customServiceUUID" size="50" placeholder="Enter the UUID of your service" style="display:none; margin-top:5px;">
    </label>
    <br><br>

    <!-- Sélection de la caractéristique de position -->
    <label>
      Position Characteristic :
      <select id="charPosition">
        <option value="00001234-8e22-4541-9d4c-21edae82ed19">mySTM32WB15CC (not yours)</option>
        <option value="000000a1-8e22-4541-9d4c-21edae82ed19">mySTM32WB55 (not yours)</option>
        <option value="custom">Other (custom)</option>
      </select>
      <input type="text" id="customCharPosition" size="50" placeholder="Enter notify characteristic UUID" style="display:none; margin-top:5px;">
    </label>
    <br><br>


    <!-- Sélection de la caractéristique Chat/Souris -->
    <label>
      State Button ChatSouris :
      <select id="chatsouris">
        <option value="000000a2-0000-1000-8000-00805f9b34fb">mySTM32WB15CC (not yours)</option>
        <option value="000000a2-8e22-4541-9d4c-21edae82ed19">mySTM32WB55 (not yours)</option>
        <option value="custom">Other (custom)</option>
      </select>
      <input type="text" id="customChatsouris" size="50" placeholder="Enter write characteristic UUID" style="display:none; margin-top:5px;">
    </label>
    <br><br>

    <button id="toggleOnOff" class="ble-button off">OFF</button>
    <button id="toggleCatMouse" class="ble-button cat">🐱 CAT</button>
  </div>

    <div style="text-align: center; margin-bottom: 20px;">
    <label style="color: white;">Width: <input id="arenaWidth" type="number" value="400"></label>
    <label style="color: white;">Height: <input id="arenaHeight" type="number" value="300"></label>
    <br><br>
    <button id="resize">Resize Arena</button>
  </div>

  <script>
  function setupDropdown(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);
    select.addEventListener("change", () => {
      input.style.display = (select.value === "custom") ? "inline-block" : "none";
    });
  }

  setupDropdown("serviceUUID", "customServiceUUID");
  setupDropdown("charPosition", "customCharPosition");
  setupDropdown("chatsouris", "customChatsouris");

  // Fonction pour récupérer la vraie valeur choisie
  function getSelectedValue(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);
    return (select.value === "custom") ? input.value.trim() : select.value;
  }

  // Remplace ta fonction précédente :
  function getSelectedServiceUUID() {
    return getSelectedValue("serviceUUID", "customServiceUUID");
  }
  </script>


  <script>
  const selectService = document.getElementById("serviceUUID");
  const customInput = document.getElementById("customServiceUUID");

  selectService.addEventListener("change", () => {
    if (selectService.value === "custom") {
      customInput.style.display = "inline-block";
    } else {
      customInput.style.display = "none";
    }
  });

  // Fonction utilitaire pour récupérer la vraie valeur sélectionnée
  function getSelectedServiceUUID() {
    return (selectService.value === "custom") ? customInput.value.trim() : selectService.value;
  }
  </script>

  <div id="ble-info">
  <h3>Services & Caractéristiques</h3>
  <pre id="ble-log"></pre>
  </div>

  <div id="notify-info">
  <h3>Notifications reçues</h3>
  <pre id="notify-log"></pre>
  </div>




  <br><br>
  <canvas id="arena" width="400" height="300"></canvas>

  <script>
    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");
    let robot = { x: 50, y: 50, angle: 0};
    let target = { x: 100, y: 50, angle: 0};

    //need to set the server in global because we have multiple services
    let server = null;
    let device = null;

    function drawArena() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw perimeter rectangle
      ctx.strokeStyle = "black";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      // Draw 
      ctx.save();
      ctx.translate(robot.x, robot.y);       // move to robot position
      ctx.rotate(robot.angle);               // rotate
      ctx.font = "32px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐱", 0, 0);              // draw at (0,0)
      ctx.restore();
      ctx.save();
      ctx.translate(target.x, target.y);       // move to robot position              
      ctx.font = "32px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐭", 0, 0);
      ctx.restore();
    }

    function moveRobot(x, y, angle) {
      robot.x = x;
      robot.y = y;
      robot.angle = angle;
      drawArena();
    }

      function moveTarget(x, y) {
      target.x = x;
      target.y = y;
      drawArena();
    }

    function logBLE(message) {
    const log = document.getElementById("ble-log");
    log.textContent += message + "\n";
    }

    function logNotify(message) {
      const log = document.getElementById("notify-log");
      let lines = log.textContent.trim().split("\n");

    // Ajouter le nouveau message en haut
      lines.unshift(message);

    // Garder seulement 20 lignes max
      if (lines.length > 20) {
        lines = lines.slice(0, 20);
      }

      log.textContent = lines.join("\n");
    }


    // Handle arena resize
    document.getElementById("resize").addEventListener("click", () => {
      const w = parseInt(document.getElementById("arenaWidth").value);
      const h = parseInt(document.getElementById("arenaHeight").value);
      canvas.width = w;
      canvas.height = h;
      drawArena();
    });

    

    // === BLE Connection ===
    document.getElementById("connect").addEventListener("click", async () => {
    try {
      // Get UUIDs from input boxes
      const serviceUUID = getSelectedServiceUUID();
      const charPositionUUID = getSelectedValue("charPosition", "customCharPosition");


      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [serviceUUID]
    });

      logBLE("Appareil sélectionné : " + device.name);

      server = await device.gatt.connect(); 

      const connectBtn = document.getElementById('connect');
      connectBtn.textContent = '✅ Connected';
      connectBtn.classList.remove('connect');
      connectBtn.classList.add('connected');

      // restore visuel si le périphérique se déconnecte
      device.addEventListener('gattserverdisconnected', () => {
        connectBtn.textContent = 'Connect to Robot (BLE)';
        connectBtn.classList.remove('connected');
        connectBtn.classList.add('connect');
      });

      const services = await server.getPrimaryServices();

      for (const service of services) {
        logBLE("Service: " + service.uuid);

        const characteristics = await service.getCharacteristics();
        for (const char of characteristics) {
          logBLE("   ↳ Caractéristique: " + char.uuid + " props: " + JSON.stringify(char.properties));
        }
      }
        
      const service = await server.getPrimaryService(serviceUUID);
      const characteristic = await service.getCharacteristic(charPositionUUID);

      logBLE("characteristicPosition :" + characteristic)
      // Start notifications for position
      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', event => {
        const data = event.target.value;
        let x = data.getUint8(0);
        let y = data.getUint8(1);
        let angle = data.getUint8(2);
        let x_t = data.getUint8(3);
        let y_t = data.getUint8(4);
        moveTarget(x_t, y_t);
        moveRobot(x, y, robot.angle);
        logNotify(`X=${x} Y=${y} Angle=${angle} Target=(${x_t},${y_t})`);

      let raw = [];
      for (let i = 0; i < data.byteLength; i++) {
        raw.push(data.getUint8(i).toString(16).padStart(2, "0"));
      }
        logNotify("Trame brute: " + raw.join(" "));
    });

  } catch (err) {
    console.error("Erreur BLE :", err);
    logBLE("Erreur : " + err);
  }
});

    // === Écriture BLE ===
    let chatsourisCharacteristic = null;

    async function writeToCharacteristic(uuid, message) {
      try {
        const serviceUUID = getSelectedServiceUUID();
        const service = await server.getPrimaryService(serviceUUID);

        if (!chatsourisCharacteristic) {
          const chatsourisUUID = getSelectedValue("chatsouris", "customChatsouris");
          chatsourisCharacteristic = await service.getCharacteristic(chatsourisUUID);
        }

        const encoder = new TextEncoder();
        const value = encoder.encode(message);
        await chatsourisCharacteristic.writeValue(value);

        logBLE(`Envoyé: "${message}" sur ${chatsourisCharacteristic.uuid}`);
      } catch (err) {
        logBLE("Erreur écriture: " + err);
        console.error(err);
      }
    }

    let stateOn = false;
    const btnOnOff = document.getElementById("toggleOnOff");
    btnOnOff.addEventListener("click", async () => {
      stateOn = !stateOn;
      const msg = stateOn ? "on" : "off";
      await writeToCharacteristic("chatsouris", msg);

      // Met à jour l’apparence du bouton
      btnOnOff.textContent = msg.toUpperCase();
      btnOnOff.classList.toggle("on", stateOn);
      btnOnOff.classList.toggle("off", !stateOn);
    });

    let stateCat = true;
    const btnCatMouse = document.getElementById("toggleCatMouse");
    btnCatMouse.addEventListener("click", async () => {
      stateCat = !stateCat;
      const msg = stateCat ? "cat" : "mouse";
      await writeToCharacteristic("chatsouris", msg);

      // Met à jour l’apparence du bouton
      btnCatMouse.textContent = stateCat ? "🐱 CAT" : "🐭 MOUSE";
      btnCatMouse.classList.toggle("cat", stateCat);
      btnCatMouse.classList.toggle("mouse", !stateCat);
    });


    // Initial draw
    drawArena();
  </script>
</body>
</html>
